# Host .env and ./data outlive the container. A new GAME_SECRET changes every past answer.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://wordle.sakla.me
    image: kelime5678:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://wordle.sakla.me
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
